<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Loan Approval Assessor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 flex items-center justify-center">

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Loan Approval Predictor</h2>
        <p class="text-gray-600 mb-6 text-sm">Underwriting assessment engine based on Indian banking benchmarks.</p>

        <form id="loanForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">CIBIL Score (300-900)</label>
                <input type="number" id="cibil" min="300" max="900" value="750" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Employment Type</label>
                <select id="employment" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Salaried">Salaried</option>
                    <option value="Self-Employed">Self-Employed</option>
                    <option value="Business">Business</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Monthly Income (₹)</label>
                <input type="number" id="income" value="75000" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Existing Monthly EMIs (₹)</label>
                <input type="number" id="emi" value="15000" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Requested Loan Amount (₹)</label>
                <input type="number" id="loan_amount" value="1000000" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tenure (Months)</label>
                <input type="number" id="tenure" value="60" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Collateral Value (Pledge Property/FDs) (₹)</label>
                <input type="number" id="collateral" value="1200000" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button type="submit" class="md:col-span-2 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 mt-2">
                Assess Loan Eligibility
            </button>
        </form>

        <div id="result" class="hidden mt-6 p-4 rounded-lg border">
            <h3 id="statusTitle" class="text-xl font-bold mb-2"></h3>
            <p class="text-sm text-gray-700 mb-1">Approval Probability: <span id="probVal" class="font-bold"></span>%</p>
            <p class="text-sm text-gray-700 mb-2">Calculated FOIR: <span id="foirVal" class="font-bold"></span>%</p>
            <ul id="reasonsList" class="list-disc list-inside text-xs text-red-600"></ul>
        </div>
    </div>

    <script>
        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                cibil: document.getElementById('cibil').value,
                income: document.getElementById('income').value,
                emi: document.getElementById('emi').value,
                loan_amount: document.getElementById('loan_amount').value,
                tenure: document.getElementById('tenure').value,
                employment: document.getElementById('employment').value,
                collateral: document.getElementById('collateral').value
            };

            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const resultDiv = document.getElementById('result');
            const title = document.getElementById('statusTitle');
            const reasonsList = document.getElementById('reasonsList');

            reasonsList.innerHTML = '';
            resultDiv.classList.remove('hidden', 'bg-green-50', 'bg-red-50', 'border-green-300', 'border-red-300');

            if (data.approved) {
                resultDiv.classList.add('bg-green-50', 'border-green-300');
                title.className = 'text-xl font-bold text-green-700';
                title.innerText = 'Loan Approved';
            } else {
                resultDiv.classList.add('bg-red-50', 'border-red-300');
                title.className = 'text-xl font-bold text-red-700';
                title.innerText = 'Loan Rejected';

                data.reasons.forEach(r => {
                    const li = document.createElement('li');
                    li.innerText = r;
                    reasonsList.appendChild(li);
                });
            }

            document.getElementById('probVal').innerText = data.probability;
            document.getElementById('foirVal').innerText = data.foir;
        });
    </script>
</body>
</html>
